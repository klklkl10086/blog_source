name: Hexo Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Install Dependencies
        run: npm install

      - name: Deploy
        env:
          GH_TOKEN: ${{ secrets.HEXO_DEPLOY_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          CLEAN_TOKEN=$(echo -n "${GH_TOKEN}" | tr -d '\n' | tr -d '\r' | tr -d ' ')
          git config --global url."https://${CLEAN_TOKEN}@github.com/".insteadOf "https://github.com/"
          
          sed -i "s|repository:.*|repository: https://github.com/klklkl10086/klklkl10086.github.io.git|g" _config.yml
          npx hexo clean
          npx hexo generate
          npx hexo deploy
